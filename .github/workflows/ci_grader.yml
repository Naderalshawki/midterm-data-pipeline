name: Automated Grader & Cross-Machine CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-pipeline:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    env:
      PYTHONPATH: .
      MONGO_URI: mongodb://localhost:27017
      MONGO_DATABASE: hybrid_pipeline_db
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Prepare Environment and Test Dataset
        run: python tests/ci_setup.py

      - name: Run Unified PyTest Grader Suite (Phase 1 & Phase 2)
        run: python -m pytest tests/test_phase2_api.py -v -s
