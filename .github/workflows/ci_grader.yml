name: Automated Grader & Cross-Machine CI (Phase 1 & Phase 2)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  verify-pipeline-on-clean-machine:
    name: Run Full Pipeline & API on Clean Ubuntu Machine
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    env:
      PYTHONPATH: "."
      MONGO_URI: "mongodb://localhost:27017"
      MONGO_DATABASE: "hybrid_pipeline_db"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Install Project Dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: 4. Prepare Environment (.env from .env.example)
        run: |
          if [ -f .env.example ]; then cp .env.example .env; fi

      - name: 5. Wait for MongoDB 7.0 & Verify Sample Dataset
        run: |
          python - << 'EOF'
          import time
          from pathlib import Path
          from pymongo import MongoClient

          # Wait for MongoDB service container
          for _ in range(15):
              try:
                  c = MongoClient("mongodb://localhost:27017", serverSelectionTimeoutMS=2000)
                  c.admin.command("ping")
                  print("[+] MongoDB 7.0 is online and ready!")
                  break
              except Exception:
                  time.sleep(1)

          data_dir = Path("data")
          data_dir.mkdir(exist_ok=True)
          csvs = [f for f in data_dir.glob("*.csv") if f.stat().st_size > 0]
          if not csvs:
              sample = data_dir / "01_student_test_small.csv"
              header = "order_id,order_date,customer_id,customer_phone,customer_email,city,district,status,payment_method,payment_status,delivery_type,delivery_cost,payment_amount,total_amount,currency,items_json
"
              rows = []
              cities = ["?????", "???", "???", "??", "??????"]
              statuses = ["confirmed", "delivered", "pending", "shipped"]
              for i in range(1, 501):
                  c = cities[i % len(cities)]
                  s = statuses[i % len(statuses)]
                  rows.append(
                      f'ORD-{10000+i},2025-02-{(i%28)+1:02d}T10:00:00Z,CUST-{100+(i%50)},771234{i:03d},user{i}@mail.com,{c},??????,{s},cash,paid,standard,1000,15000,16000,YER,"[{{\"item_name\":\"SKU-{(i%6)+1}\",\"quantity\":1,\"unit_price\":15000,\"subtotal\":15000}}]"'
                  )
              sample.write_text(header + "
".join(rows) + "
", encoding="utf-8")
              print("[+] Generated fallback evaluation CSV:", sample)
          else:
              print("[+] Found existing CSV datasets:", [f.name for f in csvs])
          EOF

      - name: 6. Run Automated PyTest Suite (All Phase 1 & Phase 2 Requirements)
        run: |
          python -m pytest tests/test_phase2_api.py -v -s
